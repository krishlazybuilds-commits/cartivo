# Local/production-like orchestration for Cartivo: Postgres + Django + Next.js.
# Usage: docker compose up --build
# Provide secrets via backend/.env (gitignored). See backend/.env.example.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cartivo}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Point the app at the compose database service.
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded media outside the container.
      - media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
